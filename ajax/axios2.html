<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Axios #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/axios.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>Axios Get/Post</h1>
    <div id="get"></div>
    <div id="post"></div>

    <script>
        function exibirResultado(id, dados){
            // Transformando os dados em String
            const texto = JSON.stringify(dados)
            //Mandando para as divs do HTML 
            document.getElementById(id).innerHTML = texto
        }

        //Chamando o AXIOS, onde para o GET o primeiro parametro é o prefixo dá URL e o segundo já é os parametros como objeto
        axios.get('parOuImpar', {
            params :{
                numero: 6
            }
        }).then(resp => exibirResultado('get', resp.data))

        // OU passando direto no parametro do AXIOS
        //axios('parOuImpar?numero=9').then(resp => exibirResultado('get', resp.data))

        axios.post('formulario', {
            nome: 'João',
            sobrenome: 'Silva'
        }).then(resp => exibirResultado('post', resp.data))
       
    </script>
</body>
