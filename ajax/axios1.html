<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Axios #01</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/axios.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>Estados</h1>

    <script>
        // A diferença de Axios pro Fetch é que o AXIOS não preciso informar que o meu response vire um JSON, porque ele já vem 
        // E para pegar os valores utilizados o resp.data que vem todos os valores
        const url = 'dados/estados.json'
        axios(url).then(resp => { 
            const itens = resp.data.reduce(
                (html, estado) => html + `<li>${estado.nome}</li>`, ''

            )
            document.body.insertAdjacentHTML('beforeend', `<ul>${itens}</ul>`)

        })
    </script>
</body>
